[project]
name = "py-harness"
version = "0.2.0"
description = "Shared build and health tooling for Python repositories. Consumed by extend and include, never copied."
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# A checker whose new version can fail code that passed is pinned exactly, so it moves only
# with a release of this package. The rest run the checks without deciding them, so they take
# compatible ranges; each consumer's lockfile still records the version it runs.
dependencies = [
  "basedpyright==1.40.1",
  "coverage>=7.16.2,<8",
  "grimp>=3.17,<4",
  "import-linter>=2.15,<3",
  "pytest>=9.1.1,<10",
  "pytest-cov>=7.1.0,<8",
  "pytest-randomly>=4.0,<5",
  "pytest-xdist>=3.8,<4",
  "ruff==0.16.9",
]

[project.entry-points.pytest11]
py-harness = "py_harness.pytest_plugin"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_harness"]

[tool.hatch.build.targets.wheel.shared-data]
"share" = "share/py-harness"

[tool.ruff]
extend = "share/ruff.toml"

[tool.basedpyright]
extends = "share/pyrightconfig.json"

[tool.importlinter]
root_packages = ["py_harness"]

[[tool.importlinter.contracts]]
name = "Commands sit on records, records sit on plumbing"
type = "layers"
containers = ["py_harness"]
exhaustive = true
layers = [
    "stop_gate",
    "change_gate",
    "run",
    "stage : doctor : summary : agent : baseline : audit : guard",
    "logs : rules",
    "findings : layout : suppressions : pytest_plugin",
    "verdict : transcript : projects : wiring",
    "console : tables : tree",
]
